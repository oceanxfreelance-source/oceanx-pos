# Production-like stack. Copy apps/api/.env.example to .env and fill in secrets first.
#   docker compose up -d db
#   docker compose run --rm api node dist/db/migrate.js
#   docker compose run --rm api node dist/cli/create-superadmin.js --email you@example.com --name "Admin"
#   docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oceanx
      POSTGRES_USER: oceanx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oceanx']
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: { context: ., target: api }
    env_file: .env
    environment:
      DATABASE_URL: postgres://oceanx:${POSTGRES_PASSWORD}@db:5432/oceanx
      TRUST_PROXY: '1'
    volumes: [storage:/data/storage]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: { context: ., target: web }
    ports: ['8080:8080']
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  storage:

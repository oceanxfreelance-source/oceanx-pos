name: Android apps (OceanX POS tablet, Gravity phone)

# Builds both Android apps from android/ and publishes each as a GitHub release so it can be downloaded
# and installed:
#   - OceanX POS for tablets (restaurants and cafés): release "android-v<version>"
#   - Gravity for phones (quotations & invoices):     release "gravity-android-v<version>"
# A release that already exists is never replaced: a rebuilt APK with another signing key would not
# install over the copy people already have. Bump the version in android/app/build.gradle to publish.
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apps.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # The permanent key lives only in the repository's secrets (never in the code). Without it a
          # temporary key is used: the app works, but a later update must be installed after removing it.
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING=permanent" >> "$GITHUB_ENV"
          else
            pw=$(openssl rand -hex 16)
            echo "::add-mask::$pw"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass "$pw" -keypass "$pw" -alias oceanx \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=OceanX, O=OceanX, C=MV"
            echo "ANDROID_KEYSTORE_PASSWORD=$pw" >> "$GITHUB_ENV"
            echo "SIGNING=temporary" >> "$GITHUB_ENV"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: built with a temporary signing key."
          fi
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        run: gradle -p android assemblePosRelease assembleGravityRelease --no-daemon
      - name: Versions
        id: v
        shell: bash
        run: |
          echo "pos=$(grep -oP "def appVersion = '\K[^']+" android/app/build.gradle)" >> "$GITHUB_OUTPUT"
          echo "gravity=$(grep -oP "def gravityVersion = '\K[^']+" android/app/build.gradle)" >> "$GITHUB_OUTPUT"
      - name: Rename
        shell: bash
        run: |
          cp android/app/build/outputs/apk/pos/release/app-pos-release.apk "OceanX-POS-Tablet-${{ steps.v.outputs.pos }}.apk"
          cp android/app/build/outputs/apk/gravity/release/app-gravity-release.apk "Gravity-${{ steps.v.outputs.gravity }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apps
          path: '*.apk'
          retention-days: 30
      - name: Publish releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publish() { # tag file title notes
            if gh release view "$1" >/dev/null 2>&1; then
              echo "Release $1 already exists: kept as it is (bump the version to publish a new one)."
            else
              gh release create "$1" "$2" --target "$GITHUB_SHA" --prerelease --title "$3" --notes "$4"
            fi
          }
          publish "android-v${{ steps.v.outputs.pos }}" "OceanX-POS-Tablet-${{ steps.v.outputs.pos }}.apk" \
            "OceanX POS for tablets ${{ steps.v.outputs.pos }}" \
            "Android tablet app for restaurants and cafés. Download the APK on the tablet, open it and allow installing from this source. Signing: $SIGNING."
          publish "gravity-android-v${{ steps.v.outputs.gravity }}" "Gravity-${{ steps.v.outputs.gravity }}.apk" \
            "Gravity for Android ${{ steps.v.outputs.gravity }}" \
            "Gravity (quotations & invoices) for Android phones. Download the APK on the phone, open it and allow installing from this source. Signing: $SIGNING."

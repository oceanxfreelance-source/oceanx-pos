name: Tablet app (Android APK)

# Builds the OceanX POS tablet app for restaurants and cafés and publishes it as a GitHub release
# ("android-v<version>") so it can be downloaded and installed on Android tablets.
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-tablet.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # The permanent key lives only in the repository's secrets (never in the code). Without it a
          # temporary key is used: the app works, but a later update must be installed after removing it.
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING=permanent" >> "$GITHUB_ENV"
          else
            pw=$(openssl rand -hex 16)
            echo "::add-mask::$pw"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass "$pw" -keypass "$pw" -alias oceanx \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=OceanX POS, O=OceanX, C=MV"
            echo "ANDROID_KEYSTORE_PASSWORD=$pw" >> "$GITHUB_ENV"
            echo "SIGNING=temporary" >> "$GITHUB_ENV"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: built with a temporary signing key."
          fi
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        run: gradle -p android assembleRelease --no-daemon
      - name: Version
        id: v
        shell: bash
        run: echo "version=$(grep -oP "def appVersion = '\K[^']+" android/app/build.gradle)" >> "$GITHUB_OUTPUT"
      - name: Rename
        shell: bash
        run: cp android/app/build/outputs/apk/release/app-release.apk "OceanX-POS-Tablet-${{ steps.v.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: OceanX-POS-Tablet-${{ steps.v.outputs.version }}
          path: OceanX-POS-Tablet-*.apk
          retention-days: 30
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-v${{ steps.v.outputs.version }}"
          file=$(ls OceanX-POS-Tablet-*.apk)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" --clobber
          else
            gh release create "$tag" "$file" --target "$GITHUB_SHA" --prerelease \
              --title "OceanX POS for tablets ${{ steps.v.outputs.version }}" \
              --notes "Android tablet app for restaurants and cafés. Download the APK on the tablet, open it and allow installing from this source. Signing: $SIGNING."
          fi

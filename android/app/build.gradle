plugins {
    id 'com.android.application'
}

// Four apps from one shell. The systems themselves update on their own (the apps open the live sites);
// bump a version only when that app's shell changes.
// OceanX POS for tablets (restaurants and cafés).
def appVersion = '1.0.4'
def appVersionCode = 5
// Gravity for phones (quotations & invoices).
def gravityVersion = '1.0.1'
def gravityVersionCode = 2
// Gravity Flow for phones (income, expenses & profit).
def flowVersion = '1.0.0'
def flowVersionCode = 1
// Gravity Budget for phones (personal budget).
def budgetVersion = '1.0.0'
def budgetVersionCode = 1

def adminVersion = '1.0.0'
def adminVersionCode = 1

android {
    namespace 'app.oceanx.pos'
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35
    }

    flavorDimensions 'product'
    productFlavors {
        pos {
            dimension 'product'
            applicationId 'app.oceanx.pos'
            versionCode appVersionCode
            versionName appVersion
            buildConfigField 'String', 'SERVER_URL', '"https://oceanx-pos-oceanx1.vercel.app"'
            // Opens on the POS (or the kitchen display); sideways, full screen, screen kept on.
            buildConfigField 'String', 'START_PATH', '"/start"'
            buildConfigField 'boolean', 'PHONE_APP', 'false'
        }
        gravity {
            dimension 'product'
            applicationId 'app.oceanx.gravity'
            versionCode gravityVersionCode
            versionName gravityVersion
            buildConfigField 'String', 'SERVER_URL', '"https://oceanx-gravity.vercel.app"'
            // A normal phone app: turns with the phone, keeps the status bar, lets the screen sleep.
            buildConfigField 'String', 'START_PATH', '"/"'
            buildConfigField 'boolean', 'PHONE_APP', 'true'
        }
        flow {
            dimension 'product'
            applicationId 'app.oceanx.flow'
            versionCode flowVersionCode
            versionName flowVersion
            buildConfigField 'String', 'SERVER_URL', '"https://oceanx-flow.vercel.app"'
            // A phone app like Gravity. Signing in from it lasts until signing out (one-time login).
            buildConfigField 'String', 'START_PATH', '"/"'
            buildConfigField 'boolean', 'PHONE_APP', 'true'
        }
        budget {
            dimension 'product'
            applicationId 'app.oceanx.budget'
            versionCode budgetVersionCode
            versionName budgetVersion
            buildConfigField 'String', 'SERVER_URL', '"https://budget.oceanx.app"'
            // A phone app like Gravity Flow: sign in once.
            buildConfigField 'String', 'START_PATH', '"/"'
            buildConfigField 'boolean', 'PHONE_APP', 'true'
        }
        admin {
            dimension 'product'
            applicationId 'app.oceanx.admin'
            versionCode adminVersionCode
            versionName adminVersion
            buildConfigField 'String', 'SERVER_URL', '"https://admin.oceanx.app"'
            // Super Admin on a phone, payments only: approve payments, see active accounts, and get a
            // notification when a payment waits (even with the app closed). Signed in once, but that
            // sign-in can do nothing else in Super Admin.
            buildConfigField 'String', 'START_PATH', '"/superadmin/phone"'
            buildConfigField 'boolean', 'PHONE_APP', 'true'
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            // Supplied by the build (GitHub secret, or a temporary key); never stored in the repository.
            storeFile file(System.getenv('ANDROID_KEYSTORE') ?: 'release.jks')
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'oceanx'
            keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>OceanX POS — No connection</title>
    <style>
      body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
      .card { text-align: center; max-width: 420px; padding: 32px; }
      h1 { font-size: 22px; margin: 16px 0 8px; }
      p { color: #94a3b8; line-height: 1.5; }
      button { margin-top: 16px; background: #0e7490; color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; font-size: 15px; cursor: pointer; }
      .dot { width: 56px; height: 56px; border-radius: 50%; background: #1e293b; display: inline-flex; align-items: center; justify-content: center; font-size: 28px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="dot">📶</div>
      <h1>No internet connection</h1>
      <p>OceanX POS needs the internet. It will reconnect by itself as soon as the connection is back.</p>
      <p id="count"></p>
      <button id="retry">Try again now</button>
    </div>
    <script>
      const target = new URLSearchParams(location.search).get('url');
      const go = () => { if (target && /^https?:/.test(target)) location.href = target; };
      document.getElementById('retry').onclick = go;
      let n = 15;
      setInterval(() => { n -= 1; document.getElementById('count').textContent = 'Retrying in ' + n + ' s'; if (n <= 0) { n = 15; go(); } }, 1000);
      window.addEventListener('online', go);
    </script>
  </body>
</html>
